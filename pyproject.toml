[project]
name = "utility667"
version = "0.2.0"
description = "667 Utility — Windows ve macOS icin sistem optimizasyon, kurulum ve temizlik araci"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "psutil>=7.2.2",
    "pyside6>=6.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
]

[project.scripts]
utility667 = "main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",    # satir uzunlugu: formatlayici zaten hallediyor
    "SIM105",  # contextlib.suppress her zaman daha okunakli degil
    "B008",    # Qt API'lerinde varsayilan cagri yaygin
]

[tool.ruff.lint.per-file-ignores]
"src/ui/style.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "src"]
